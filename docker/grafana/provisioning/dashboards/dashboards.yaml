# Dashboard provider: everything dropped in /var/lib/grafana/dashboards is
# auto-loaded, no UI import needed.
apiVersion: 1

providers:
  - name: claude-analytics
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
