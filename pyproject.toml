[project]
name = "analyze-claude-projects"
version = "0.1.0"
description = "Ingest Claude Code session transcripts into PostgreSQL (+pg_parquet) and analyse per-call token/cache behaviour."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "orjson>=3.10",
    "polars>=1.17",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
acp = "analyze_claude_projects.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pyyaml>=6.0.3",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20260815",
]
nlp = [
    "numpy>=2.5.2",
    "sentence-transformers>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyze_claude_projects"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["polars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: loads the real SentenceTransformer model and/or the network; opt-in with -m slow",
]
