name: release-please

on:
  push:
    branches: [main]
    # Do not widen this to swallow pyproject.toml or *.json — a release PR's own diff
    # touches pyproject.toml, .release-please-manifest.json, and __init__.py, and the
    # post-merge run must still fire to create the tag.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # Docs-only merges skip the push trigger; `gh workflow run release-please.yml` catches up.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
